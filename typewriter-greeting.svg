<svg width="860" height="80" viewBox="0 0 860 80" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    </style>
    <filter id="roseGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="80" fill="#0a0e1a"/>

  <!--
    Strategy: one <text> element, left-anchored at a fixed x.
    The full string is "hiee :) i am rushda." = 21 chars.
    At font-size 24, Courier New char width ≈ 14.4px.
    Full string width ≈ 21 * 14.4 = ~302px.
    Center offset: (860 - 302) / 2 = 279. Start x = 279.
    Each char revealed by animating a white clipRect that grows right.
    We use individual <text> elements stacked at fixed x positions
    so spacing is 100% deterministic — no tspan weirdness.
  -->

  <!-- Character x positions: start=279, step=14.4px -->
  <!-- h=279  i=293  e=308  e=322  ' '=336  :=351  )=365  ' '=379
       i=394  ' '=408  a=422  m=437  ' '=451  r=466  u=480  s=494
       h=508  d=523  a=537  .=551  -->

  <text font-family="'Courier New', Courier, monospace" font-size="24" fill="#c9929e" filter="url(#roseGlow)" y="50">
    <tspan x="279" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.20s" dur="0.01s" fill="freeze"/>h</tspan>
    <tspan x="293" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.33s" dur="0.01s" fill="freeze"/>i</tspan>
    <tspan x="308" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.46s" dur="0.01s" fill="freeze"/>e</tspan>
    <tspan x="322" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.59s" dur="0.01s" fill="freeze"/>e</tspan>
    <tspan x="336" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.72s" dur="0.01s" fill="freeze"/> </tspan>
    <tspan x="351" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.85s" dur="0.01s" fill="freeze"/>:</tspan>
    <tspan x="365" opacity="0"><animate attributeName="opacity" values="0;1" begin="0.98s" dur="0.01s" fill="freeze"/>)</tspan>
    <tspan x="379" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.11s" dur="0.01s" fill="freeze"/> </tspan>
    <tspan x="394" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.24s" dur="0.01s" fill="freeze"/>i</tspan>
    <tspan x="408" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.37s" dur="0.01s" fill="freeze"/> </tspan>
    <tspan x="422" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.50s" dur="0.01s" fill="freeze"/>a</tspan>
    <tspan x="437" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.63s" dur="0.01s" fill="freeze"/>m</tspan>
    <tspan x="451" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.76s" dur="0.01s" fill="freeze"/> </tspan>
    <tspan x="466" opacity="0"><animate attributeName="opacity" values="0;1" begin="1.89s" dur="0.01s" fill="freeze"/>r</tspan>
    <tspan x="480" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.02s" dur="0.01s" fill="freeze"/>u</tspan>
    <tspan x="494" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.15s" dur="0.01s" fill="freeze"/>s</tspan>
    <tspan x="508" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.28s" dur="0.01s" fill="freeze"/>h</tspan>
    <tspan x="523" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.41s" dur="0.01s" fill="freeze"/>d</tspan>
    <tspan x="537" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.54s" dur="0.01s" fill="freeze"/>a</tspan>
    <tspan x="551" opacity="0"><animate attributeName="opacity" values="0;1" begin="2.67s" dur="0.01s" fill="freeze"/>.</tspan>
  </text>

  <!-- Cursor: moves to next char position after each reveal, blinks at end -->
  <rect width="2" height="26" y="29" fill="#c9929e" rx="1" filter="url(#roseGlow)">
    <animate attributeName="x"
      values="279;293;308;322;336;351;365;379;394;408;422;437;451;466;480;494;508;523;537;551;566"
      keyTimes="0;0.048;0.095;0.143;0.190;0.238;0.286;0.333;0.381;0.429;0.476;0.524;0.571;0.619;0.667;0.714;0.762;0.810;0.857;0.905;1"
      dur="2.67s" begin="0.20s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1;0;1;0;1" dur="0.9s" begin="2.9s" repeatCount="indefinite"/>
  </rect>
</svg>
