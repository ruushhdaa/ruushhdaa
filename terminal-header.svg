<svg width="860" height="260" viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#060910"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1f35"/>
      <stop offset="100%" style="stop-color:#141928"/>
    </linearGradient>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="greenGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="termClip">
      <rect x="0" y="36" width="860" height="224"/>
    </clipPath>
  </defs>

  <!-- Terminal window -->
  <rect width="860" height="260" rx="10" fill="url(#termBg)"/>

  <!-- Border glow -->
  <rect x="0.5" y="0.5" width="859" height="259" rx="10" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Title bar -->
  <rect x="0" y="0" width="860" height="36" rx="10" fill="url(#titleBar)"/>
  <rect x="0" y="20" width="860" height="16" fill="url(#titleBar)"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="18" r="6" fill="#ff5f57">
    <animate attributeName="opacity" values="1;0.7;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="18" r="6" fill="#febc2e">
    <animate attributeName="opacity" values="1;0.7;1" dur="4s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="18" r="6" fill="#28c840">
    <animate attributeName="opacity" values="1;0.7;1" dur="4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Title bar label -->
  <text x="430" y="23" text-anchor="middle" font-size="12" fill="#6b7280" letter-spacing="1">ruushhdaa — threat-analyst.py</text>

  <!-- CRT scanlines -->
  <g clip-path="url(#termClip)" opacity="0.035">
    <line x1="0" y1="40" x2="860" y2="40" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="44" x2="860" y2="44" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="48" x2="860" y2="48" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="52" x2="860" y2="52" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="56" x2="860" y2="56" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="60" x2="860" y2="60" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="64" x2="860" y2="64" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="68" x2="860" y2="68" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="72" x2="860" y2="72" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="76" x2="860" y2="76" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="80" x2="860" y2="80" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="84" x2="860" y2="84" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="88" x2="860" y2="88" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="92" x2="860" y2="92" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="96" x2="860" y2="96" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="100" x2="860" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="104" x2="860" y2="104" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="108" x2="860" y2="108" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="112" x2="860" y2="112" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="116" x2="860" y2="116" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="120" x2="860" y2="120" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="124" x2="860" y2="124" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="128" x2="860" y2="128" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="132" x2="860" y2="132" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="136" x2="860" y2="136" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="140" x2="860" y2="140" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="144" x2="860" y2="144" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="148" x2="860" y2="148" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="152" x2="860" y2="152" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="156" x2="860" y2="156" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="160" x2="860" y2="160" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="164" x2="860" y2="164" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="168" x2="860" y2="168" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="172" x2="860" y2="172" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="176" x2="860" y2="176" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="180" x2="860" y2="180" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="184" x2="860" y2="184" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="188" x2="860" y2="188" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="192" x2="860" y2="192" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="196" x2="860" y2="196" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="860" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="204" x2="860" y2="204" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="208" x2="860" y2="208" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="212" x2="860" y2="212" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="216" x2="860" y2="216" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="220" x2="860" y2="220" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="224" x2="860" y2="224" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="228" x2="860" y2="228" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="232" x2="860" y2="232" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="236" x2="860" y2="236" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="240" x2="860" y2="240" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="244" x2="860" y2="244" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="248" x2="860" y2="248" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="252" x2="860" y2="252" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="256" x2="860" y2="256" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Scanline sweep -->
  <rect x="0" y="36" width="860" height="8" fill="rgba(168,85,247,0.05)" clip-path="url(#termClip)">
    <animate attributeName="y" values="36;252;36" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- LINE 1: prompt + command -->
  <text x="30" y="68" font-size="13" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.3s" fill="freeze"/>
    <tspan fill="#a855f7" filter="url(#purpleGlow)">/cyber $</tspan>
    <tspan fill="#e2e8f0"> cat rushda.py</tspan>
  </text>
  <!-- cursor after line 1 while typing -->
  <rect x="208" y="54" width="8" height="16" fill="#a855f7" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0;1;0" dur="1.2s" begin="0.3s" repeatCount="1" fill="freeze"/>
  </rect>

  <!-- LINE 2: open brace -->
  <text x="30" y="92" font-size="13" fill="#64748b" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="1.3s" fill="freeze"/>
    {
  </text>

  <!-- LINE 3: identity — trimmed, no "Rushda " trailing -->
  <text x="30" y="114" font-size="13" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="1.7s" fill="freeze"/>
    <tspan fill="#818cf8">  "identity"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#34d399" filter="url(#greenGlow)">"Rushda"</tspan><tspan fill="#64748b">,</tspan>
  </text>

  <!-- LINE 4: role — trimmed -->
  <text x="30" y="136" font-size="13" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="2.1s" fill="freeze"/>
    <tspan fill="#818cf8">  "role"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#fbbf24">"B.Tech CSE (Data Science) · MITAOE"</tspan><tspan fill="#64748b">,</tspan>
  </text>

  <!-- LINE 5: focus -->
  <text x="30" y="158" font-size="13" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="2.5s" fill="freeze"/>
    <tspan fill="#818cf8">  "focus"</tspan><tspan fill="#64748b">: [</tspan><tspan fill="#f87171">"anomaly detection"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#f87171">"GNN threat intel"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#f87171">"ML security"</tspan><tspan fill="#64748b">],</tspan>
  </text>

  <!-- LINE 6: arsenal -->
  <text x="30" y="180" font-size="13" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="2.9s" fill="freeze"/>
    <tspan fill="#818cf8">  "arsenal"</tspan><tspan fill="#64748b">: [</tspan><tspan fill="#c084fc">"PyTorch"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#c084fc">"Scapy"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#c084fc">"Nmap"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#c084fc">"MITRE ATT&amp;CK"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#c084fc">"SHAP"</tspan><tspan fill="#64748b">],</tspan>
  </text>

  <!-- LINE 7: status -->
  <text x="30" y="202" font-size="13" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="3.3s" fill="freeze"/>
    <tspan fill="#818cf8">  "status"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#34d399" filter="url(#greenGlow)">"∿ actively building · patterns over rules"</tspan>
  </text>

  <!-- LINE 8: close brace -->
  <text x="30" y="224" font-size="13" fill="#64748b" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="3.7s" fill="freeze"/>
    }
  </text>

  <!-- LINE 9: final prompt -->
  <text x="30" y="246" font-size="13" fill="#a855f7" filter="url(#purpleGlow)" opacity="0">
    /cyber $
    <animate attributeName="opacity" values="0;1" dur="0.05s" begin="4.1s" fill="freeze"/>
  </text>

  <!-- Final blinking cursor -->
  <rect x="112" y="232" width="8" height="16" fill="#a855f7" rx="1" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0;1;0;1;0;1;0" dur="1.2s" begin="4.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Glitch flash -->
  <rect x="0" y="36" width="860" height="224" fill="#a855f7" opacity="0" clip-path="url(#termClip)">
    <animate attributeName="opacity" values="0;0;0;0;0;0;0;0.03;0;0;0;0;0;0.02;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
